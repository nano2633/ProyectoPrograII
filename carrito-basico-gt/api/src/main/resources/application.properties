# Conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/cc?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=USAC123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para tener comunicacion con MYSQL y crear las tablas se usara JPA / Hibernate
# cabie update a none en la siguiente linea porque me dio problemas con la base de datos
# precisamente en la comumna porque idProducto tiene una mayuscula y en la DB esta como id_producto
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Para que Spring Boot respete mayusculas y minusculas usaremos estas dos lineas siguientes
spring.jpa.hibernate.naming.physical-
strategy=org.hibernate.boot.model.naming.PhisicalNamingStrategyStandardlmpl
# Puerto del servidor por defecto
server.port=8080
